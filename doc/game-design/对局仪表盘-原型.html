<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对局仪表盘 · 原型（可交互 · 融合版）</title>
<style>
  :root{
    --bg:#1b1e27; --bg-deep:#0e1019; --panel:#272b37; --panel2:#2f3441;
    --border:#3c4252; --accent:#f5b342; --accent-hi:#ffd785; --accent-deep:#b5761d;
    --text:#e5e9f1; --dim:#9aa3b2; --good:#74cf87; --danger:#ef5350;
    --red:#e05252; --blue:#4a86e8; --green:#57bb63; --yellow:#e8c23a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
    color:var(--text); background:
      radial-gradient(1200px 600px at 50% -10%, #2a3142 0%, transparent 60%),
      linear-gradient(180deg,#161923,#0c0e15);
    min-height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  /* 顶部：原型说明 */
  .proto-head{padding:10px 18px 6px;display:flex;align-items:baseline;gap:12px;flex:0 0 auto}
  .proto-head h1{font-size:16px;margin:0;letter-spacing:.5px}
  .proto-head .sub{font-size:12px;color:var(--dim)}
  .proto-head .warn{font-size:12px;color:var(--accent);margin-left:auto}

  /* 模拟对局画面（背景） */
  .stage{position:relative;flex:1 1 auto;margin:6px 16px 0;border-radius:14px;overflow:hidden;
    border:1px solid #2a2f3d; background:
      radial-gradient(700px 400px at 50% 60%, #232a38 0%, #12151e 70%);
    box-shadow:inset 0 0 80px #0008;}
  .stage .felt{position:absolute;inset:16% 16% 10%;border-radius:18px;
    background:linear-gradient(180deg,#1c2230,#141824);border:1px solid #2b3140}
  .stage .felt:after{content:"（这里是对局棋盘 / 3D 桌面）";position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;color:#4a5468;font-size:14px}

  /* ── 布局（对齐 drawio：左列 选项 → 玩家纵览；顶部仪表盘横条在选项右侧；右上 规则/战报）── */
  .options{position:absolute;top:10px;left:16px;display:flex;align-items:center;gap:8px;pointer-events:auto}
  .cornerR{position:absolute;top:10px;right:16px;display:flex;align-items:center;gap:8px;pointer-events:auto}
  .bar{position:absolute;top:10px;left:120px;right:280px;height:66px;
    display:flex;gap:14px;align-items:stretch;pointer-events:none}
  .card{background:linear-gradient(180deg,rgba(47,52,65,.96),rgba(33,37,47,.96));
    border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 26px #0009,inset 0 1px 0 #ffffff10;}
  .card.pad{padding:8px 12px;display:flex;align-items:center;gap:12px}
  /* 现有按钮（选项 / 规则 / 战报）：实现里位置一字未动，横条只让开它们 */
  .ibar{pointer-events:auto;background:linear-gradient(180deg,#343a48,#262b36);
    border:1px solid var(--border);border-radius:10px;color:var(--text);font:inherit;font-size:13px;
    padding:7px 12px;cursor:pointer}
  .ibar:hover{border-color:var(--accent)}
  .spacer{flex:1 1 auto}

  /* 轮次卡 */
  .round{flex-direction:column;gap:4px;min-width:150px;align-items:stretch;justify-content:center}
  .round .label{font-size:10px;letter-spacing:2px;color:var(--dim)}
  .round .big{display:flex;align-items:baseline;gap:6px}
  .round .n{font-size:26px;font-weight:800;color:var(--accent);line-height:1;text-shadow:0 0 18px #f5b34240}
  .round .of{font-size:12px;color:var(--dim)}
  .round .bar2{height:6px;border-radius:6px;background:#1a1e28;overflow:hidden;border:1px solid #00000040}
  .round .bar2>i{display:block;height:100%;width:0%;
    background:linear-gradient(90deg,var(--accent-deep),var(--accent),var(--accent-hi));transition:width .5s}

  /* 当前行动 + 阶段 stepper */
  .now{flex:1 1 auto;flex-direction:column;gap:3px;min-width:0;align-items:stretch;justify-content:center}
  .now .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
  .now .who .me{color:var(--accent);font-weight:700}
  .dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px #0006,0 0 10px currentColor}
  .steps{display:flex;align-items:center;gap:2px;flex-wrap:nowrap}
  .step{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:8px;
    font-size:12px;color:var(--dim);border:1px solid transparent;white-space:nowrap;transition:.25s}
  .step .k{width:7px;height:7px;border-radius:50%;background:#4a5468}
  .step.done{color:#8fbf9a}
  .step.done .k{background:var(--good)}
  .step.cur{color:#101319;background:linear-gradient(180deg,var(--accent-hi),var(--accent));
    border-color:var(--accent-hi);font-weight:800;box-shadow:0 0 16px #f5b34255}
  .step.cur .k{background:#101319}
  .sep{color:#39404f;font-size:12px}
  .wait{font-size:12px;color:var(--text);display:flex;align-items:center;gap:8px}
  .wait .pill{padding:2px 8px;border-radius:999px;font-size:11px;
    background:#f5b34222;border:1px solid #f5b34255;color:var(--accent-hi)}
  .wait .t{color:var(--danger);font-weight:700}

  /* 畸变横幅（融合后移到横条之下、居中） */
  .abanner{position:absolute;top:84px;left:50%;transform:translateX(-50%);
    padding:5px 14px;border-radius:999px;font-size:13px;color:#f0c064;
    background:rgba(30,24,14,.9);border:1px solid #f5b34266;box-shadow:0 6px 18px #0008;pointer-events:none}

  /* 玩家纵览（左列，落在选项之下） */
  .rail{position:absolute;left:16px;top:86px;width:200px;display:flex;flex-direction:column;gap:7px;
    pointer-events:none}
  .prow{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:10px}
  .prow .nm{font-size:13px;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow .money{font-size:12.5px;color:var(--accent)}
  .prow .meta{font-size:10.5px;color:var(--dim);text-align:right;line-height:1.4}
  .prow.turn{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 20px #f5b34233;
    background:linear-gradient(180deg,rgba(60,52,35,.96),rgba(36,33,26,.96))}
  .prow.turn .nm{color:var(--accent-hi);font-weight:700}
  .prow.dead{opacity:.45}
  .tag{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid #ffffff22;color:var(--dim)}
  .tag.sleep{color:#c9a6ff;border-color:#c9a6ff66}
  .tag.bot{color:#8fb7f2;border-color:#8fb7f255}

  /* 控制条（仅原型） */
  .controls{flex:0 0 auto;margin:8px 16px 14px;padding:10px 14px;display:flex;gap:10px;align-items:center;
    background:linear-gradient(180deg,rgba(47,52,65,.9),rgba(28,31,40,.9));border:1px solid var(--border);
    border-radius:12px;flex-wrap:wrap}
  .controls b{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:1px}
  button{font:inherit;color:var(--text);background:#343a48;border:1px solid #47506a;border-radius:9px;
    padding:7px 12px;cursor:pointer;transition:.15s}
  button:hover{background:#3e4658;border-color:var(--accent)}
  button.go{background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:#171a22;font-weight:800;border-color:var(--accent-hi)}
  .hint{font-size:11.5px;color:var(--dim);max-width:520px}
</style>
</head>
<body>
  <div class="proto-head">
    <h1>对局仪表盘 · 原型（融合版）</h1>
    <span class="sub">顶部指挥带把「第几轮 / 谁在行动 / 到哪个阶段 / 还剩多久」与暂停·规则·战报融成一条</span>
    <span class="warn">← 草稿，欢迎推翻</span>
  </div>

  <div class="stage">
    <div class="felt"></div>

    <!-- 左上：选项（暂停） -->
    <div class="options"><button class="ibar">⏸ 暂停</button></div>

    <!-- 右上：规则 / 战报 -->
    <div class="cornerR">
      <button class="ibar">规则说明</button>
      <button class="ibar">战报 ▾</button>
    </div>

    <!-- 顶部仪表盘横条：选项右侧的一条带（不铺到选项背后） -->
    <div class="bar">
      <div class="card pad round">
        <div class="label">回合 / ROUND</div>
        <div class="big"><span class="n" id="roundN">1</span><span class="of">/ 30</span></div>
        <div class="bar2"><i id="roundBar"></i></div>
      </div>

      <div class="card pad now">
        <div class="who">
          <span class="dot" id="whoDot" style="color:#e05252;background:#e05252"></span>
          <span>当前行动：</span><span class="me" id="whoName">你</span>
          <span class="tag" id="whoTag">轮到你</span>
        </div>
        <div class="steps" id="steps"></div>
        <div class="wait" id="wait"></div>
      </div>
    </div>

    <!-- 畸变横幅：横条之下、居中 -->
    <div class="abanner" id="abanner">🌀 畸变生效中：断网·剩 3 回合</div>

    <!-- 右侧玩家纵览（落在横条之下） -->
    <div class="rail" id="rail"></div>
  </div>

  <!-- 控制条（仅原型演示） -->
  <div class="controls">
    <button class="go" id="playBtn">▶ 自动播放</button>
    <button id="prevPhase">◀ 上一阶段</button>
    <button id="nextPhase">下一阶段 ▶</button>
    <button id="nextPlayer">换下一位玩家</button>
    <button id="nextRound">回合 +1</button>
    <span class="spacer"></span>
    <span class="hint" id="hint"></span>
  </div>

<script>
/* ---------- 模拟的一局 ---------- */
const PLAYERS = [
  {name:"你",   color:"#e05252", money:20000, props:0, stamina:3, status:""},
  {name:"小明", color:"#4a86e8", money:18600, props:3, stamina:2, status:""},
  {name:"阿强", color:"#57bb63", money:21000, props:2, stamina:5, status:"sleep"},
  {name:"晓雯", color:"#e8c23a", money:16800, props:4, stamina:1, status:"bot"},
];
const PHASES = [
  {id:"start",  name:"回合开始"},
  {id:"roll",   name:"① 掷轮盘"},
  {id:"move",   name:"移动"},
  {id:"settle", name:"落地结算"},
  {id:"item",   name:"② 使用道具"},
  {id:"end",    name:"回合结束"},
];
/* 每个阶段在「等待提示」里显示的不同环节（对应 await: roll/prompt/card/shop/black/item） */
const WAIT_BY_PHASE = {
  start:  {who:"系统", text:"结算体力 / 冷却 / 融化", time:null},
  roll:   {who:"轮他", text:"等待掷轮盘", time:35},
  move:   {who:"系统", text:"逐格移动中…", time:null},
  settle: {who:"轮他", text:"等待决定：买地 / 升级", time:25},
  item:   {who:"轮他", text:"道具阶段（可跳过）", time:12},
  end:    {who:"系统", text:"本回合结束，轮到下一位", time:null},
};

let round = 1, pi = 0, phase = 0, playing = false, timer = null;

/* ---------- 渲染 ---------- */
function render(){
  // 回合
  document.getElementById("roundN").textContent = round;
  document.getElementById("roundBar").style.width = (round/30*100).toFixed(1)+"%";

  // 当前行动者
  const p = PLAYERS[pi];
  document.getElementById("whoName").textContent = p.name;
  document.getElementById("whoName").style.color = p.color;
  const d = document.getElementById("whoDot");
  d.style.color = p.color; d.style.background = p.color;
  const tag = document.getElementById("whoTag");
  tag.textContent = (pi===0) ? "轮到你" : "等待他行动";
  tag.className = "tag" + (p.status==="sleep"?" sleep":p.status==="bot"?" bot":"");

  // 阶段 stepper
  const box = document.getElementById("steps");
  box.innerHTML = "";
  PHASES.forEach((ph,i)=>{
    if(i>0){ const s=document.createElement("span"); s.className="sep"; s.textContent="›"; box.appendChild(s); }
    const el=document.createElement("span");
    el.className = "step " + (i<phase?"done":i===phase?"cur":"");
    el.innerHTML = '<span class="k"></span>'+ph.name;
    box.appendChild(el);
  });

  // 等待提示
  const w = WAIT_BY_PHASE[PHASES[phase].id];
  const wait = document.getElementById("wait");
  const who = (w.who==="轮他") ? p.name : w.who;
  wait.innerHTML = `<span class="pill">${who}</span> ${w.text}` +
    (w.time ? ` · 剩 <span class="t">${w.time}s</span>` : "");

  // 玩家纵览
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  PLAYERS.forEach((pl,i)=>{
    const row = document.createElement("div");
    row.className = "card prow" + (i===pi?" turn":"") + (pl.status==="dead"?" dead":"");
    let tag = "";
    if(pl.status==="sleep") tag = '<span class="tag sleep">休眠</span>';
    if(pl.status==="bot")   tag = '<span class="tag bot">托管</span>';
    row.innerHTML =
      `<span class="dot" style="color:${pl.color};background:${pl.color}"></span>`+
      `<span class="nm">${pl.name}</span>${tag}`+
      `<span class="meta"><span class="money">¥${pl.money.toLocaleString()}</span><br>地 ${pl.props} · 力 ${pl.stamina}</span>`;
    rail.appendChild(row);
  });

  document.getElementById("hint").textContent =
    `第 ${round}/30 轮 · 轮到「${p.name}」 · 阶段：${PHASES[phase].name}`;
}

/* ---------- 推进逻辑 ---------- */
function nextPhase(){
  phase++;
  if(phase >= PHASES.length){ phase = 0; nextPlayer(); }
  render();
}
function prevPhase(){
  phase--; if(phase < 0){ phase = PHASES.length-1; }
  render();
}
function nextPlayer(){
  pi = (pi+1) % PLAYERS.length;
  if(pi === 0) round = Math.min(round+1, 30);
  render();
}
function nextRound(){ round = Math.min(round+1,30); pi=0; phase=0; render(); }
function setPlaying(on){
  playing = on;
  document.getElementById("playBtn").textContent = on ? "⏸ 暂停" : "▶ 自动播放";
  if(timer){ clearInterval(timer); timer=null; }
  if(on) timer = setInterval(()=>{ nextPhase(); if(round>=30 && pi===PLAYERS.length-1 && phase===PHASES.length-1) setPlaying(false); }, 1500);
}

document.getElementById("playBtn").onclick = ()=>setPlaying(!playing);
document.getElementById("prevPhase").onclick = ()=>{ setPlaying(false); prevPhase(); };
document.getElementById("nextPhase").onclick = ()=>{ setPlaying(false); nextPhase(); };
document.getElementById("nextPlayer").onclick = ()=>{ setPlaying(false); nextPlayer(); };
document.getElementById("nextRound").onclick = ()=>{ setPlaying(false); nextRound(); };

render();
</script>
</body>
</html>

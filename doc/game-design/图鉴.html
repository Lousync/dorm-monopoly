<style>
	:root{

	.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

		border-radius:999px;padding:8px 18px;transition:.15s;

	.count b{color:var(--gold);font-size:15px}

		position:relative;background:var(--panel);border:1px solid var(--line2);
		border-radius:var(--radius);padding:14px 16px 15px;overflow:hidden;

	.ttl{flex:1 1 auto;min-width:0}

	.card.dim .name{color:#c3ccd3}
	.sub{color:var(--dim);font-size:12px;margin-top:2px}
	.flag{display:inline-block;margin-left:7px;font-size:11px;padding:1px 7px;border-radius:5px;

	.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}

	.row>.v{flex:1 1 auto;min-width:0;color:#c6d2da;word-break:break-word}
	.card code{background:rgba(255,255,255,.07);border-radius:4px;padding:0 4px;
		font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12.5px;color:#e6d6a8}
	.card b,.card strong{color:#fff}
	.empty{color:var(--dim);padding:40px 4px;text-align:center}

		color:var(--dim);font-size:12px;line-height:2}

		border-radius:5px;padding:1px 6px}
	@media (max-width:640px){
		.grid{grid-template-columns:1fr}
		h1{font-size:21px}
		.count{width:100%}
	}
</style>

<script>
"use strict";
(function () {
	// ---------- 数据 ----------
	var raw = document.getElementById("gallery-data").textContent.trim();
	var DATA = null;
	try { DATA = JSON.parse(raw); } catch (e) { DATA = null; }
	if (!DATA || !DATA.sections) {
		document.getElementById("grid").innerHTML =
			'<div class="empty">数据未注入 —— 这是<b>模板文件</b>。<br>' +
			'成品在 <code>doc/game-design/图鉴.html</code>，由 <code>tools/gen_gallery.gd</code> 生成。</div>';
		document.getElementById("q").disabled = true;
		return;
	}

	// ---------- 工具 ----------
	function esc(s) {
		return String(s).replace(/[&<>"']/g, function (c) {
			return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
		});
	}
	// 极简行内 markdown：先转义，再放行 **粗体** 与 `代码`（其余一律按纯文本对待）
	function fmt(s) {
		return esc(s)
			.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
			.replace(/`([^`]+)`/g, "<code>$1</code>");
	}
	function el(tag, cls, html) {
		var d = document.createElement(tag);
		if (cls) d.className = cls;
		if (html != null) d.innerHTML = html;
		return d;
	}

	// ---------- 状态 ----------
	// 页签可由 URL 锚点选中（`图鉴.html#techs`）—— 既是给别人甩链接的入口，
	// 也让「换个页签截图看看」不用靠点鼠标。
	var cur = 0;
	var q = "";
	var sel = {};                      // sel[页签下标][facet 名] = { 值: true }
	DATA.sections.forEach(function (s, i) {
		sel[i] = {};
		if (s.id === location.hash.replace("#", "")) cur = i;
	});

	// ---------- 头部 ----------
	var meta = document.getElementById("meta");
	meta.innerHTML = "共 <b>" + DATA.total + "</b> 条 · 数据来源 " +
		DATA.sources.map(function (p) { return "<code>" + esc(p) + "</code>"; }).join("、") +
		"<br>本页为<b>生成产物</b>，请勿手改；改数据后重跑生成器。";
	if (DATA.warnings && DATA.warnings.length) {
		// 收进折叠里：这是一份**待办清单**，常驻展开会把正文挤到屏外；但也不能藏起来
		// ——这几条正是生成器替人盯着的东西（见 tools/gen_gallery.gd 顶部注释）。
		document.getElementById("warn").innerHTML =
			"<details><summary>⚠ 代码与文档对不上（" + DATA.warnings.length +
			" 条）— 点开看清单</summary><ul>" +
			DATA.warnings.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") +
			"</ul></details>";
	}
	document.getElementById("foot").innerHTML =
		"重新生成：<code>godot --headless --path . --script tools/gen_gallery.gd</code>　·　" +
		"品质配色取自 <code>scripts/item_data.gd</code>，档位配色取自 <code>scripts/tech_data.gd</code>，卡型判定取自 <code>scripts/game_data.gd</code>。";

	// ---------- 页签 ----------
	var tabs = document.getElementById("tabs");
	DATA.sections.forEach(function (s, i) {
		var b = el("button", i === cur ? "on" : "");
		b.innerHTML = esc(s.title) + '<span class="n">' + s.entries.length + "</span>";
		b.addEventListener("click", function () {
			cur = i; q = "";
			document.getElementById("q").value = "";
			location.hash = s.id;
			renderTabs(); renderFacets(); render();
		});
		tabs.appendChild(b);
	});
	function renderTabs() {
		Array.prototype.forEach.call(tabs.children, function (b, i) {
			b.className = i === cur ? "on" : "";
		});
	}

	// ---------- 筛选栏 ----------
	var facetsBox = document.getElementById("facets");
	function renderFacets() {
		facetsBox.innerHTML = "";
		var sec = DATA.sections[cur];
		if (!sec.facets || !sec.facets.length) return;
		sec.facets.forEach(function (f) {
			var row = el("div", "facet");
			row.appendChild(el("span", "lbl", esc(f.key)));
			f.values.forEach(function (v) {
				var on = sel[cur][f.key] && sel[cur][f.key][v];
				var b = el("button", "chip" + (on ? " on" : ""), esc(v));
				b.addEventListener("click", function () {
					if (!sel[cur][f.key]) sel[cur][f.key] = {};
					if (sel[cur][f.key][v]) delete sel[cur][f.key][v];
					else sel[cur][f.key][v] = true;
					if (!Object.keys(sel[cur][f.key]).length) delete sel[cur][f.key];
					renderFacets(); render();
				});
				row.appendChild(b);
			});
			facetsBox.appendChild(row);
		});
	}

	// ---------- 过滤 ----------
	function textOf(e) {
		var parts = [e.title, e.subtitle, e.body];
		(e.rows || []).forEach(function (r) { parts.push(r.k, r.v); });
		(e.chips || []).forEach(function (c) { parts.push(c.t); });
		return parts.join(" ").toLowerCase();
	}
	function keep(e) {
		var f = sel[cur];
		for (var k in f) {
			var want = f[k];
			var hit = false;
			for (var v in want) if (e.facets && e.facets[k] === v) hit = true;
			if (!hit) return false;                   // 同一 facet 内多选取「或」
		}
		return !q || textOf(e).indexOf(q) >= 0;
	}

	// ---------- 渲染 ----------
	var grid = document.getElementById("grid");
	function render() {
		var sec = DATA.sections[cur];
		var list = sec.entries.filter(keep);
		document.getElementById("count").innerHTML =
			"<b>" + list.length + "</b> / " + sec.entries.length + " 条";

		grid.innerHTML = "";
		if (!list.length) { grid.appendChild(el("div", "empty", "没有匹配的条目。")); return; }
		list.forEach(function (e) {
			var c = el("div", "card" + (e.dim ? " dim" : ""));
			c.style.setProperty("--accent", e.accent || "#4a5b66");

			var head = el("div", "chead");
			var ico = el("div", "ico");
			if (e.icon) ico.appendChild(el("img")).src = e.icon;
			else ico.textContent = e.glyph || "·";
			head.appendChild(ico);

			var t = el("div", "ttl");
			var flag = e.flag ? '<span class="flag">' + esc(e.flag) + "</span>" : "";
			t.appendChild(el("div", "name", fmt(e.title) + flag));
			if (e.subtitle) t.appendChild(el("div", "sub", fmt(e.subtitle)));
			head.appendChild(t);
			c.appendChild(head);

			if (e.chips && e.chips.length) {
				var tags = el("div", "tags");
				e.chips.forEach(function (ch) {
					var g = el("span", "tag" + (ch.color ? " c" : ""), esc(ch.t));
					if (ch.color) g.style.color = ch.color;
					tags.appendChild(g);
				});
				c.appendChild(tags);
			}
			if (e.body) c.appendChild(el("div", "body", fmt(e.body)));
			if (e.rows && e.rows.length) {
				var rows = el("div", "rows");
				e.rows.forEach(function (r) {
					var d = el("div", "row");
					d.appendChild(el("div", "k", esc(r.k)));
					d.appendChild(el("div", "v", fmt(r.v)));
					rows.appendChild(d);
				});
				c.appendChild(rows);
			}
			grid.appendChild(c);
		});
	}

	// ---------- 搜索 ----------
	document.getElementById("q").addEventListener("input", function (ev) {
		q = ev.target.value.trim().toLowerCase();
		render();
	});

	renderFacets();
	render();
})();
</script>

name: CI

# 覆盖 README「自动化测试」一节的全部命令。此仓库此前没有任何 CI，
# 8023 行 GDScript 全靠手敲命令把关（见审查结论）。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6.2
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$URL"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      # .godot/ 是 gitignore 的，游戏模式不会重建全局类缓存（start.bat 里踩过这个坑：
      # 缓存陈旧会让 autoload 解析失败、所有按钮失灵），必须先导入一次。
      # 首次导入可能返回非零，不因此判失败——真正的把关在下面的测试。
      - name: 导入资源
        run: godot --headless --import --path . || echo "import 返回非零，继续"

      - name: 单测与回归
        run: |
          set -euo pipefail
          for t in rules_test load_all item_test shop_test blackshop_test casino_test aberration_test tech_test chance_test regression_test pause_menu_test rules_panel_test hud_test settings_test settings_ui_test layout_test chars_test placard_test lab_case_test; do
            echo "::group::$t"
            godot --headless --path . --script "tests/$t.gd"
            echo "::endgroup::"
          done

      # 图鉴页（doc/game-design/图鉴.html）是**生成产物**：提交进 git，但由
      # scripts/*_data.gd 与 doc/game-design/道具图鉴.md 生成。
      # 改了数据却忘了重跑生成器 ⇒ 这一闸当场逮住；生成器是确定性的（无时间戳、无随机序），
      # 所以正常情况不会误报。重跑：godot --headless --path . --script tools/gen_gallery.gd
      # 行尾：生成器写 LF（Godot 默认），仓库存的也是 LF；本机 core.autocrlf 不影响
      # `git diff` 的比较（两侧都会先归一化成 LF），已实测。
      - name: 图鉴页不过期
        run: |
          set -euo pipefail
          godot --headless --path . --script tools/gen_gallery.gd
          git diff --exit-code -- doc/game-design/图鉴.html

      # game.gd 的导航索引同样是**生成产物**：由 tools/gen_game_index.gd 从 game.gd
      # 自身的区块横幅生成、写回文件头的标记块之间（手写的索引必然烂——参见
      # tests/load_all.gd 里体积棘轮那段注释）。改了区块/函数却忘了重跑 ⇒ 这一闸逮住。
      # 重跑：godot --headless --path . --script tools/gen_game_index.gd
      - name: 游戏索引不过期
        run: |
          set -euo pipefail
          godot --headless --path . --script tools/gen_game_index.gd
          git diff --exit-code -- scripts/game.gd

      # 房主即服务器：起一个后台房主，再跑一个客户端自动对打 3 轮
      - name: 联机回归（房主 + 客户端 3 轮）
        run: |
          set -euo pipefail
          godot --headless --path . -- --autotest=host --rounds=3 > host.log 2>&1 &
          HOST_PID=$!
          sleep 4
          godot --headless --path . -- --autotest=client --rounds=3
          wait "$HOST_PID"
          cat host.log
          grep -q "AUTOTEST HOST OK round=3" host.log
